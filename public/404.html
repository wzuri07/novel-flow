<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Novel Flow</title>
    <script>
      // The app uses hash-based routing, so any unknown path goes back to the app root.
      var base = window.location.pathname.split('/').slice(0, 2).join('/') + '/';
      window.location.replace(window.location.origin + base);
    </script>
  </head>
  <body></body>
</html>
